# Stage II - self-forcing, initialized from stage I (epoch 299).
# The released checkpoint is epoch 59. Trained on 3 GPUs x 16 (bf16); with 1 GPU the effective
# batch is 3x smaller.
DATA:
  WINDOW: 150
  MOTION_FPS: 15
  VISUAL_FPS: 5
  BATCH_SIZE: 16
  NUM_WORKERS: 2
MODEL:
  COND_RGB: true
  COND_DEPTH: true
  COND_GOAL: true
  COND_TRAJ: true
  USE_KV_CACHE: true
  MASKING:
    TRAJ: 0.05
TRAIN:
  FORCING: self
  NUM_EPOCHS: 100
  LR: 3.0e-5
  WEIGHT_DECAY: 0.01
  LR_STEP_EPOCHS: 50
  LR_STEP_GAMMA: 0.1
  GLOBAL_ORIENT_WEIGHT: 1.5
  GLOBAL_TRANS_WEIGHT: 1.5
  HEADCAM_LOSS_WEIGHT: 0.0
  NUM_GPUS: 3
  PRECISION: bf16-mixed
